name: Security Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security regression check
        run: python scripts/security-check.py
