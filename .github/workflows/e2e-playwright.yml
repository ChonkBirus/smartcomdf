name: E2E Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node deps
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + ${{ matrix.browser }}
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps ${{ matrix.browser }}


      - name: Build app
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Start preview server
        run: |
          bun run preview --port 8080 &
          echo $! > server.pid
          for i in {1..40}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Seed E2E fixtures (clean state)
        run: scripts/e2e-seed.sh
        env:
          PGHOST: ${{ secrets.E2E_PGHOST }}
          PGPORT: ${{ secrets.E2E_PGPORT }}
          PGUSER: ${{ secrets.E2E_PGUSER }}
          PGPASSWORD: ${{ secrets.E2E_PGPASSWORD }}
          PGDATABASE: ${{ secrets.E2E_PGDATABASE }}
          E2E_A_USER_ID: ${{ secrets.E2E_A_USER_ID }}
          E2E_B_USER_ID: ${{ secrets.E2E_B_USER_ID }}
          E2E_A_ACCESS_TOKEN: ${{ secrets.E2E_A_ACCESS_TOKEN }}
          E2E_B_ACCESS_TOKEN: ${{ secrets.E2E_B_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Run Playwright E2E tests (${{ matrix.browser }})
        run: |
          mkdir -p test-results
          python tests/e2e/mobile-nav-esc-focustrap.py 2>&1 | tee test-results/output-${{ matrix.browser }}.log
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_AUTH_STATUS: injected

      - name: Teardown E2E fixtures
        if: always()
        run: python tests/e2e/seed_fixtures.py --teardown || true
        env:
          PGHOST: ${{ secrets.E2E_PGHOST }}
          PGPORT: ${{ secrets.E2E_PGPORT }}
          PGUSER: ${{ secrets.E2E_PGUSER }}
          PGPASSWORD: ${{ secrets.E2E_PGPASSWORD }}
          PGDATABASE: ${{ secrets.E2E_PGDATABASE }}

      - name: Verify no leftovers
        if: always()
        # TODO: ampliar para companies/customers/items/item_images/quotes/quote_items/quote_payments/projects/service_orders
        run: |
          if [ -z "$PGHOST" ]; then echo "SKIP leftover check: PGHOST not set"; exit 0; fi
          leftover=$(psql -tA -c "SELECT COUNT(*) FROM public.financial_transactions WHERE description LIKE '[E2E-%';" || echo 0)
          echo "leftover financial_transactions=$leftover"
          test "$leftover" = "0"
        env:
          PGHOST: ${{ secrets.E2E_PGHOST }}
          PGPORT: ${{ secrets.E2E_PGPORT }}
          PGUSER: ${{ secrets.E2E_PGUSER }}
          PGPASSWORD: ${{ secrets.E2E_PGPASSWORD }}
          PGDATABASE: ${{ secrets.E2E_PGDATABASE }}



      - name: Stop preview server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            test-results/
            tests/e2e/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

