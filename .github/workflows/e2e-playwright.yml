          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - name: Seed E2E fixtures (clean state)
        run: scripts/e2e-seed.sh
        env:
          PGHOST: ${{ secrets.E2E_PGHOST }}
          PGPORT: ${{ secrets.E2E_PGPORT }}
          PGUSER: ${{ secrets.E2E_PGUSER }}
          PGPASSWORD: ${{ secrets.E2E_PGPASSWORD }}
          PGDATABASE: ${{ secrets.E2E_PGDATABASE }}
          E2E_A_USER_ID: ${{ secrets.E2E_A_USER_ID }}
          E2E_B_USER_ID: ${{ secrets.E2E_B_USER_ID }}
          E2E_A_ACCESS_TOKEN: ${{ secrets.E2E_A_ACCESS_TOKEN }}
          E2E_B_ACCESS_TOKEN: ${{ secrets.E2E_B_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Run multi-company isolation audit
        run: |
          mkdir -p test-results
          python tests/e2e/multi-company-isolation.py 2>&1 | tee test-results/multi-company.log
        env:
          E2E_BROWSER: chromium
          E2E_A_SUPABASE_SESSION_JSON: ${{ secrets.E2E_A_SUPABASE_SESSION_JSON }}
          E2E_A_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_A_SUPABASE_STORAGE_KEY }}
          E2E_B_SUPABASE_SESSION_JSON: ${{ secrets.E2E_B_SUPABASE_SESSION_JSON }}
          E2E_B_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_B_SUPABASE_STORAGE_KEY }}
          E2E_VIEWER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_VIEWER_SUPABASE_SESSION_JSON }}
          E2E_VIEWER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_VIEWER_SUPABASE_STORAGE_KEY }}

      - name: Teardown E2E fixtures
        if: always()
        run: python tests/e2e/seed_fixtures.py --teardown || true
        env:
          PGHOST: ${{ secrets.E2E_PGHOST }}
          PGPORT: ${{ secrets.E2E_PGPORT }}
          PGUSER: ${{ secrets.E2E_PGUSER }}
          PGPASSWORD: ${{ secrets.E2E_PGPASSWORD }}
          PGDATABASE: ${{ secrets.E2E_PGDATABASE }}

      - name: Stop preview server
        if: always()
        run: if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
      - name: Upload multi-company artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-company-results
          path: |
            test-results/
            tests/e2e/artifacts/multi-company/**
          if-no-files-found: ignore
          retention-days: 14

